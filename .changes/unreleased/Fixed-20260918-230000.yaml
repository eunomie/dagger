kind: Fixed
body: |
  A module's Dang entrypoint no longer receives the caller's workspace. It
  receives a workspace built from the module's own context, with its working
  directory at the module: the repository for a git module, the directory for
  a directory module, and the loaded files for a local module. An entrypoint
  is code the module's author chose, and it runs when the module is loaded, so
  it could read any file in the workspace of whoever loaded the module. A
  module that needs the caller's workspace declares a `Workspace` argument on
  a function.
time: 2026-09-18T23:00:00Z
